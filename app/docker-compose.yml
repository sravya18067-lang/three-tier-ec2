# Three-tier app: frontend (nginx) -> backend (Node/Express) -> database (PostgreSQL)
# Only the frontend publishes a port. Backend (5000) and DB (5432) are reachable
# only on internal Docker networks.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_local}
    depends_on:
      db:
        condition: service_healthy
    networks: [web, data]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [backend]
    networks: [web]

networks:
  web: {}
  data:
    internal: true   # DB network has no route to the outside world

volumes:
  pgdata: {}
